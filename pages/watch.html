<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMube Edu - مشاهدة الدرس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --player-radius: 20px;
            --plyr-color-main: #6C5CE7;
            --plyr-video-controls-background: rgba(0, 0, 0, 0.85);
            --plyr-menu-background: rgba(20, 20, 30, 0.98);
        }

        .video-player-wrapper {
            background: #000;
            border-radius: var(--player-radius);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
            max-width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            margin: 0 auto;
        }

        /* إطار متوهج حول المشغل */
        .video-player-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--player-radius) + 3px);
            background: linear-gradient(135deg, 
                #6C5CE7, #a78bfa, #6C5CE7, #a78bfa
            );
            background-size: 300% 300%;
            z-index: -1;
            opacity: 0.6;
            animation: gradientRotate 4s ease infinite;
        }

        @keyframes gradientRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ============ Plyr Overrides - تحسين الوضوح ============ */
        .plyr {
            border-radius: var(--player-radius) !important;
            font-family: 'Cairo', sans-serif !important;
            direction: ltr !important;
            --plyr-color-main: #6C5CE7;
        }

        .plyr--video {
            border-radius: var(--player-radius) !important;
        }

        .plyr__video-wrapper {
            border-radius: var(--player-radius) !important;
        }

        .plyr__poster {
            border-radius: var(--player-radius) !important;
            background-size: cover !important;
        }

        /* زر التشغيل الكبير - أكثر وضوحاً */
        .plyr__control--overlaid {
            background: rgba(108, 92, 231, 0.95) !important;
            border: 3px solid rgba(255, 255, 255, 0.9) !important;
            border-radius: 50% !important;
            width: 80px !important;
            height: 80px !important;
            box-shadow: 
                0 0 0 8px rgba(108, 92, 231, 0.3),
                0 0 40px rgba(108, 92, 231, 0.6),
                0 10px 30px rgba(0, 0, 0, 0.5) !important;
            transition: all 0.3s ease !important;
            opacity: 1 !important;
        }

        .plyr__control--overlaid:hover {
            background: #6C5CE7 !important;
            border-color: #fff !important;
            transform: scale(1.1) !important;
            box-shadow: 
                0 0 0 12px rgba(108, 92, 231, 0.4),
                0 0 60px rgba(108, 92, 231, 0.8),
                0 15px 40px rgba(0, 0, 0, 0.6) !important;
        }

        .plyr__control--overlaid svg {
            width: 36px !important;
            height: 36px !important;
            fill: #fff !important;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)) !important;
        }

        /* شريط التحكم السفلي - خلفية معتمة واضحة */
        .plyr__controls {
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.95) 0%, 
                rgba(0, 0, 0, 0.8) 50%,
                rgba(0, 0, 0, 0.4) 100%
            ) !important;
            backdrop-filter: blur(10px) !important;
            padding: 15px 15px 10px !important;
            border-radius: 0 0 var(--player-radius) var(--player-radius) !important;
            gap: 10px !important;
            min-height: 50px !important;
        }

        /* أزرار التحكم - أكبر وأكثر وضوحاً */
        .plyr__control {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.1) !important;
            transition: all 0.2s ease !important;
            border-radius: 8px !important;
            min-width: 40px !important;
            min-height: 40px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .plyr__control:hover {
            background: rgba(108, 92, 231, 0.6) !important;
            color: #fff !important;
            transform: scale(1.05) !important;
        }

        .plyr__control svg {
            width: 20px !important;
            height: 20px !important;
            fill: #fff !important;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)) !important;
        }

        /* شريط التقدم - أوضح وأسمك */
        .plyr__progress__container {
            flex: 1 !important;
            padding: 5px 0 !important;
        }

        .plyr__progress input[type="range"] {
            --plyr-range-track-height: 8px;
            height: 8px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }

        .plyr__progress__buffer {
            background: rgba(255, 255, 255, 0.2) !important;
            border-radius: 4px !important;
        }

        .plyr__progress--played {
            background: linear-gradient(to right, #6C5CE7, #a78bfa) !important;
            border-radius: 4px !important;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.5) !important;
        }

        .plyr__tooltip {
            background: rgba(0, 0, 0, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 6px !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            padding: 5px 12px !important;
            font-family: 'Cairo', sans-serif !important;
            color: #fff !important;
        }

        /* مؤشر شريط التقدم - أكبر وأوضح */
        .plyr__progress input[type="range"]::-webkit-slider-thumb {
            width: 22px !important;
            height: 22px !important;
            background: #fff !important;
            border: 3px solid #6C5CE7 !important;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.8), 0 2px 8px rgba(0,0,0,0.5) !important;
            transition: all 0.2s ease !important;
            cursor: pointer !important;
        }

        .plyr__progress input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3) !important;
            border-color: #a78bfa !important;
            box-shadow: 0 0 30px rgba(108, 92, 231, 1) !important;
        }

        .plyr__progress input[type="range"]::-moz-range-thumb {
            width: 22px !important;
            height: 22px !important;
            background: #fff !important;
            border: 3px solid #6C5CE7 !important;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.8) !important;
            cursor: pointer !important;
        }

        /* مستوى الصوت */
        .plyr__volume input[type="range"] {
            --plyr-range-track-height: 5px;
            height: 5px !important;
        }

        .plyr__volume input[type="range"]::-webkit-slider-thumb {
            width: 16px !important;
            height: 16px !important;
            background: #6C5CE7 !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.6) !important;
        }

        /* الوقت - خط أوضح */
        .plyr__time {
            color: #fff !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            font-family: 'Cairo', sans-serif !important;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5) !important;
            min-width: 45px !important;
            text-align: center !important;
        }

        .plyr__time--current {
            color: #a78bfa !important;
        }

        /* فاصل الوقت */
        .plyr__time + .plyr__time::before {
            content: '/' !important;
            margin: 0 4px !important;
            color: rgba(255,255,255,0.5) !important;
        }

        /* قائمة الإعدادات - أوضح */
        .plyr__menu__container {
            background: rgba(20, 20, 30, 0.98) !important;
            backdrop-filter: blur(20px) !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            font-family: 'Cairo', sans-serif !important;
            min-width: 220px !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
            padding: 8px 0 !important;
        }

        .plyr__menu__container button {
            color: #fff !important;
            padding: 12px 20px !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            transition: all 0.2s ease !important;
        }

        .plyr__menu__container button:hover {
            background: rgba(108, 92, 231, 0.4) !important;
        }

        .plyr__menu__container button[aria-checked="true"] {
            color: #a78bfa !important;
            background: rgba(108, 92, 231, 0.2) !important;
        }

        /* أيقونة الإعدادات */
        .plyr__control[data-plyr="settings"] svg {
            fill: #fff !important;
        }

        /* زر ملء الشاشة */
        .plyr__control[data-plyr="fullscreen"] svg {
            fill: #fff !important;
        }

        /* إخفاء شعار يوتيوب */
        .plyr--youtube .plyr__control[data-plyr="youtube-logo"] {
            display: none !important;
        }

        /* فيديو عادي */
        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            border-radius: var(--player-radius) !important;
            background: #000 !important;
        }

        video::-webkit-media-controls-panel {
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.95) 0%, 
                rgba(0, 0, 0, 0.7) 100%
            ) !important;
        }

        video::-webkit-media-controls-play-button {
            filter: brightness(1.2) !important;
        }

        /* باقي التنسيقات */
        .video-info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: #6C5CE7;
            border-color: #6C5CE7;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
        }

        .action-btn.liked {
            background: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
        }

        .video-stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 16px 0;
        }

        .stat-badge {
            background: rgba(108, 92, 231, 0.1);
            border: 1px solid rgba(108, 92, 231, 0.2);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .stat-badge:hover {
            background: rgba(108, 92, 231, 0.2);
            border-color: #6C5CE7;
            transform: translateY(-1px);
        }

        .stat-badge i {
            color: #6C5CE7;
        }

        .comment-form, .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .star-rating i {
            cursor: pointer;
            color: #94a3b8;
            font-size: 24px;
            margin-left: 6px;
            transition: all 0.2s ease;
        }

        .star-rating i:hover {
            color: #fbbf24;
            transform: scale(1.2);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .star-rating i.active {
            color: #fbbf24;
        }

        textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 16px 0;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #6C5CE7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #94a3b8;
        }

        .btn-sm {
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 25px;
            width: auto;
            background: linear-gradient(135deg, #6C5CE7, #a78bfa);
            border: none;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .btn-sm:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-text {
            font-size: 14px;
            margin-top: 12px;
            line-height: 1.6;
        }

        .loading-spinner {
            text-align: center;
            padding: 80px 40px;
        }

        .loading-spinner i {
            font-size: 48px;
            animation: spin 1s linear infinite;
            color: #6C5CE7;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* التوافق مع الأجهزة المحمولة */
        @media (max-width: 768px) {
            .video-player-wrapper {
                border-radius: 12px;
            }

            .plyr__control--overlaid {
                width: 60px !important;
                height: 60px !important;
            }

            .plyr__control--overlaid svg {
                width: 28px !important;
                height: 28px !important;
            }

            .plyr__controls {
                padding: 12px 10px 8px !important;
                gap: 6px !important;
            }

            .plyr__control {
                min-width: 36px !important;
                min-height: 36px !important;
            }

            .plyr__control svg {
                width: 18px !important;
                height: 18px !important;
            }

            .plyr__time {
                font-size: 12px !important;
                min-width: 35px !important;
            }

            .video-info-card {
                padding: 16px;
            }

            .action-btn {
                padding: 8px 16px;
                font-size: 13px;
            }

            .stat-badge {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .plyr__controls {
                padding: 10px 6px 6px !important;
                gap: 4px !important;
            }

            .plyr__control {
                min-width: 32px !important;
                min-height: 32px !important;
            }

            .plyr__control svg {
                width: 16px !important;
                height: 16px !important;
            }

            .plyr__time {
                font-size: 11px !important;
                min-width: 30px !important;
            }

            .plyr__progress input[type="range"] {
                --plyr-range-track-height: 6px;
            }

            .plyr__progress input[type="range"]::-webkit-slider-thumb {
                width: 18px !important;
                height: 18px !important;
            }
        }

        @media (min-width: 1400px) {
            .video-player-wrapper {
                max-width: 90%;
            }
            
            .plyr__control--overlaid {
                width: 90px !important;
                height: 90px !important;
            }

            .plyr__control--overlaid svg {
                width: 40px !important;
                height: 40px !important;
            }

            .plyr__controls {
                padding: 18px 20px 12px !important;
            }

            .plyr__control {
                min-width: 44px !important;
                min-height: 44px !important;
            }

            .plyr__time {
                font-size: 15px !important;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="logo">
            <i class="fas fa-graduation-cap"></i>
            <span>GMube Edu</span>
        </a>
        <div style="display:flex;gap:8px;">
            <button onclick="history.back()" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-right"></i> رجوع
            </button>
            <a href="../index.html" class="btn btn-secondary btn-sm">
                <i class="fas fa-home"></i> الرئيسية
            </a>
        </div>
    </div>

    <div class="page-container">
        <div id="watchContent">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>جاري التحميل...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="teachers.html" class="nav-item"><i class="fas fa-users"></i><span>الأساتذة</span></a>
        <a href="../login.html" class="nav-item" id="accountNav"><i class="fas fa-user"></i><span>حسابي</span></a>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/error-handler.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        var video = null;
        var session = getSession();
        var rating = 0;
        var liked = false;
        var plyrPlayer = null;

        document.addEventListener('DOMContentLoaded', function() {
            updateAccountNav();
            var id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                loadVideo(id);
            } else {
                location.href = '../index.html';
            }
        });

        function updateAccountNav() {
            if (session) {
                var navLink = document.getElementById('accountNav');
                if (navLink) {
                    navLink.href = session.type === 'teacher' ? 'teacher.html' : 'profile.html';
                }
            }
        }

        function loadVideo(id) {
            getVideoById(id).then(function(v) {
                if (!v) {
                    showError('الدرس غير موجود');
                    return;
                }
                video = v;
                updateVideoViews(video.id, (video.views || 0) + 1);
                video.views = (video.views || 0) + 1;
                renderVideo();
                loadComments();
                checkIfLiked();
            }).catch(function(err) {
                console.error(err);
                showError('فشل تحميل الدرس');
            });
        }

        function showError(msg) {
            document.getElementById('watchContent').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>' + msg + '</p></div>';
        }

        function checkIfLiked() {
            if (!session) return;
            var likedVideos = JSON.parse(localStorage.getItem('liked_videos') || '[]');
            liked = likedVideos.indexOf(video.id) !== -1;
            var likeBtn = document.getElementById('likeBtn');
            if (likeBtn && liked) {
                likeBtn.classList.add('liked');
            }
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            var patterns = [
                /(?:youtube\.com\/watch\?v=)([^&]+)/,
                /(?:youtu\.be\/)([^?]+)/,
                /(?:youtube\.com\/embed\/)([^?]+)/,
                /(?:youtube\.com\/shorts\/)([^?]+)/
            ];
            for (var i = 0; i < patterns.length; i++) {
                var match = url.match(patterns[i]);
                if (match) return match[1];
            }
            return null;
        }

        function initPlyr(videoId) {
            if (plyrPlayer) {
                plyrPlayer.destroy();
            }

            var playerElement = document.querySelector('#plyr-player');
            if (playerElement) {
                plyrPlayer = new Plyr(playerElement, {
                    controls: [
                        'play-large',
                        'play',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'captions',
                        'settings',
                        'pip',
                        'fullscreen'
                    ],
                    settings: ['captions', 'quality', 'speed'],
                    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
                    i18n: {
                        play: 'تشغيل',
                        pause: 'إيقاف',
                        mute: 'كتم الصوت',
                        unmute: 'إلغاء كتم الصوت',
                        settings: 'الإعدادات',
                        speed: 'السرعة',
                        normal: 'عادي'
                    }
                });
            }
        }

        function getVideoHtml() {
            var sourceType = video.source_type || 'youtube';
            var videoUrl = video.url || '';
            var playerHtml = '';

            if (sourceType === 'youtube' || videoUrl.indexOf('youtube.com') !== -1 || videoUrl.indexOf('youtu.be') !== -1) {
                var videoId = extractYouTubeId(videoUrl);

                if (videoId) {
                    playerHtml = '<div id="plyr-player" data-plyr-provider="youtube" data-plyr-embed-id="' + videoId + '"></div>';
                    return {
                        html: playerHtml,
                        needsInit: true,
                        videoId: videoId
                    };
                } else {
                    playerHtml = '<div class="empty-state"><i class="fab fa-youtube"></i><p>رابط غير صالح</p><a href="' + videoUrl + '" target="_blank" class="btn">فتح على YouTube</a></div>';
                    return {
                        html: playerHtml,
                        needsInit: false,
                        videoId: null
                    };
                }
            }
            else if (sourceType === 'telegram' && videoUrl) {
                playerHtml = '<video controls autoplay style="width:100%; border-radius:12px;" poster="' + (video.thumbnail || '') + '">' +
                             '<source src="' + videoUrl + '" type="video/mp4">' +
                             'متصفحك لا يدعم تشغيل الفيديو.</video>';
                return {
                    html: playerHtml,
                    needsInit: false,
                    videoId: null
                };
            }
            else if (videoUrl && videoUrl.indexOf('.mp4') !== -1) {
                playerHtml = '<video controls autoplay style="width:100%; border-radius:12px;" poster="' + (video.thumbnail || '') + '">' +
                             '<source src="' + videoUrl + '" type="video/mp4">' +
                             'متصفحك لا يدعم تشغيل الفيديو.</video>';
                return {
                    html: playerHtml,
                    needsInit: false,
                    videoId: null
                };
            }
            else {
                playerHtml = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>لا يوجد رابط فيديو صالح</p></div>';
                return {
                    html: playerHtml,
                    needsInit: false,
                    videoId: null
                };
            }
        }

        function renderVideo() {
            var playerData = getVideoHtml();

            var starsHtml = '';
            for (var s = 1; s <= 5; s++) {
                starsHtml += '<i class="fas fa-star" data-v="' + s + '"></i>';
            }

            var container = document.getElementById('watchContent');
            container.innerHTML = 
                '<div class="video-player-wrapper">' + playerData.html + '</div>' +
                '<div class="video-info-card">' +
                    '<h2 style="font-size:18px;margin-bottom:16px;">' + esc(video.title || 'بدون عنوان') + '</h2>' +
                    '<div class="video-stats">' +
                        '<span class="stat-badge"><i class="fas fa-user-circle"></i> ' + esc(video.user_name || '') + '</span>' +
                        '<span class="stat-badge"><i class="fas fa-book"></i> ' + esc(video.category || '') + '</span>' +
                        '<span class="stat-badge"><i class="fas fa-graduation-cap"></i> ' + esc(video.grade || '') + '</span>' +
                        '<span class="stat-badge"><i class="fas fa-eye"></i> ' + fmt(video.views || 0) + '</span>' +
                        '<span class="stat-badge"><i class="fas fa-star"></i> ' + (video.avg_rating || 0).toFixed(1) + ' (' + (video.rating_count || 0) + ')</span>' +
                    '</div>' +
                    '<div class="action-buttons">' +
                        '<button class="action-btn" id="likeBtn" onclick="toggleLike()">' +
                            '<i class="fas fa-thumbs-up"></i> <span id="likesCount">' + (video.likes || 0) + '</span>' +
                        '</button>' +
                        '<button class="action-btn" onclick="saveVideo()">' +
                            '<i class="fas fa-bookmark"></i> حفظ' +
                        '</button>' +
                        '<button class="action-btn" onclick="shareVideo()">' +
                            '<i class="fas fa-share"></i> مشاركة' +
                        '</button>' +
                    '</div>' +
                '</div>' +
                '<div class="comment-form">' +
                    '<h4 style="margin-bottom:10px"><i class="fas fa-comment"></i> أضف تعليق وتقييم</h4>' +
                    '<div class="star-rating" id="stars">' + starsHtml + '</div>' +
                    '<textarea id="commentText" placeholder="اكتب تعليقك..." rows="3"></textarea>' +
                    '<button class="btn-sm" onclick="addComment()"><i class="fas fa-paper-plane"></i> إرسال</button>' +
                '</div>' +
                '<div id="commentsList"></div>';

            if (playerData.needsInit && playerData.videoId) {
                setTimeout(function() {
                    initPlyr(playerData.videoId);
                }, 100);
            }

            initStars();
            var likeBtn = document.getElementById('likeBtn');
            if (likeBtn && liked) {
                likeBtn.classList.add('liked');
            }
        }

        function initStars() {
            var stars = document.querySelectorAll('#stars i');
            for (var i = 0; i < stars.length; i++) {
                var star = stars[i];
                star.onclick = (function(s) {
                    return function() {
                        rating = parseInt(s.getAttribute('data-v'));
                        updateStars();
                    };
                })(star);
                star.onmouseover = (function(s) {
                    return function() {
                        var v = parseInt(s.getAttribute('data-v'));
                        for (var j = 0; j < stars.length; j++) {
                            stars[j].style.color = j < v ? '#fbbf24' : '#94a3b8';
                        }
                    };
                })(star);
            }
            document.getElementById('stars').onmouseleave = updateStars;
        }

        function updateStars() {
            var stars = document.querySelectorAll('#stars i');
            for (var i = 0; i < stars.length; i++) {
                stars[i].style.color = i < rating ? '#fbbf24' : '#94a3b8';
            }
        }

        function toggleLike() {
            if (!session) {
                alert('يرجى تسجيل الدخول');
                return;
            }

            var btn = document.getElementById('likeBtn');
            var count = video.likes || 0;
            var likedVideos = JSON.parse(localStorage.getItem('liked_videos') || '[]');
            var index = likedVideos.indexOf(video.id);

            if (liked) {
                count--;
                btn.classList.remove('liked');
                liked = false;
                if (index !== -1) {
                    likedVideos.splice(index, 1);
                }
            } else {
                count++;
                btn.classList.add('liked');
                liked = true;
                likedVideos.push(video.id);
            }

            localStorage.setItem('liked_videos', JSON.stringify(likedVideos));

            updateVideoLikes(video.id, count).then(function() {
                video.likes = count;
                document.getElementById('likesCount').textContent = count;
            }).catch(function(e) {
                alert('فشل تحديث الإعجابات: ' + e.message);
            });
        }

        function saveVideo() {
            if (!session) {
                alert('يرجى تسجيل الدخول');
                return;
            }

            var saved = JSON.parse(localStorage.getItem('saved_videos') || '[]');
            if (saved.indexOf(video.id) !== -1) {
                alert('تم حفظ هذا الدرس مسبقاً');
                return;
            }
            saved.push(video.id);
            localStorage.setItem('saved_videos', JSON.stringify(saved));
            alert('تم حفظ الدرس');
        }

        function shareVideo() {
            var url = location.href;
            if (navigator.share) {
                navigator.share({ title: video.title, url: url }).catch(function() {});
            } else {
                navigator.clipboard.writeText(url).then(function() {
                    alert('تم نسخ الرابط');
                });
            }
        }

        function addComment() {
            if (!session) {
                alert('يرجى تسجيل الدخول');
                return;
            }

            var text = document.getElementById('commentText').value.trim();
            if (!text) {
                alert('اكتب تعليقاً');
                return;
            }
            if (!rating) {
                alert('اختر تقييماً');
                return;
            }

            addComment(video.id, session.user_id, session.name, text, rating).then(function() {
                return getComments(video.id).then(function(comments) {
                    if (comments && comments.length > 0) {
                        var totalRating = 0;
                        for (var i = 0; i < comments.length; i++) {
                            totalRating += (comments[i].rating || 0);
                        }
                        var avgRating = totalRating / comments.length;
                        return updateVideoRating(video.id, avgRating, comments.length);
                    }
                });
            }).then(function() {
                document.getElementById('commentText').value = '';
                rating = 0;
                updateStars();
                loadComments();
                getVideoById(video.id).then(function(v) {
                    if (v) {
                        video.avg_rating = v.avg_rating;
                        video.rating_count = v.rating_count;
                        var ratingSpan = document.querySelector('.stat-badge:last-child');
                        if (ratingSpan) {
                            ratingSpan.innerHTML = '<i class="fas fa-star"></i> ' + (video.avg_rating || 0).toFixed(1) + ' (' + (video.rating_count || 0) + ')';
                        }
                    }
                });
            }).catch(function(e) {
                alert('فشل إضافة التعليق: ' + e.message);
            });
        }

        function loadComments() {
            getComments(video.id).then(function(comments) {
                var container = document.getElementById('commentsList');

                if (!comments || comments.length === 0) {
                    container.innerHTML = '<p style="text-align:center;padding:20px;color:#94a3b8">لا توجد تعليقات بعد</p>';
                    return;
                }

                var html = '';
                for (var i = 0; i < comments.length; i++) {
                    var c = comments[i];
                    var starsHtml = '';
                    for (var s = 1; s <= 5; s++) {
                        starsHtml += '<i class="fas fa-star" style="color:' + (s <= c.rating ? '#fbbf24' : '#94a3b8') + ';font-size:11px"></i>';
                    }
                    html += '<div class="comment-item">' +
                                '<div class="comment-header">' +
                                    '<strong>' + esc(c.user_name) + '</strong>' +
                                    '<span>' + fmtDate(c.created_at) + '</span>' +
                                '</div>' +
                                '<div>' + starsHtml + '</div>' +
                                '<div class="comment-text">' + esc(c.text) + '</div>' +
                            '</div>';
                }
                container.innerHTML = html;
            });
        }

        function esc(t) {
            if (!t) return '';
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function fmt(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        function fmtDate(d) {
            if (!d) return '';
            try {
                return new Date(d).toLocaleDateString('ar-EG');
            } catch(e) {
                return '';
            }
        }
    </script>
</body>
</html>
